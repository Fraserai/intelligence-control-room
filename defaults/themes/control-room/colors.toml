# Control Room — the default theme.
# Same format as Omarchy's colors.toml, so any Omarchy theme can be dropped
# into ~/.config/control-room/themes/ and selected in theme.json.
mode = "dark"

accent = "#8b7cff"
selection = "#26223f"
muted = "#2c2a3a"

background = "#0d0c14"
dark_background = "#09080f"
darker_background = "#06050a"
lighter_background = "#16141f"

foreground = "#d7d5e4"
dark_foreground = "#75728c"
light_foreground = "#e6e4f0"
bright_foreground = "#f6f5fb"

red = "#ff6b81"
yellow = "#f5c26b"
orange = "#ff9a6b"
green = "#7ee2a8"
cyan = "#6fd6e8"
blue = "#7aa2ff"
magenta = "#c792ea"
brown = "#8a6a5a"

bright_red = "#ff8a9b"
bright_yellow = "#ffd68a"
bright_green = "#9ff0c0"
bright_cyan = "#93e6f4"
bright_blue = "#9bbaff"
bright_magenta = "#dbb0f5"
